<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How to open ZXP Manager</title>
<style>
  :root {
    --bg: #f5f5f7;
    --card: #ffffff;
    --fg: #1d1d1f;
    --muted: #6e6e73;
    --border: #e3e3e8;
    --accent: #0a66d8;
    --accent-soft: #e8f1fd;
    --code-bg: #f0f0f3;
    --note-bg: #fff8e6;
    --note-border: #f2d68a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161618;
      --card: #222225;
      --fg: #f2f2f4;
      --muted: #a1a1a8;
      --border: #34343a;
      --accent: #4ba3ff;
      --accent-soft: #1d2b3d;
      --code-bg: #2c2c30;
      --note-bg: #2e2715;
      --note-border: #6b5520;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 720px; margin: 0 auto; padding: 48px 20px 64px; }
  header { display: flex; align-items: center; gap: 18px; margin-bottom: 20px; }
  header img { width: 72px; height: auto; flex: none; }
  h1 { font-size: 30px; line-height: 1.15; margin: 0; letter-spacing: -0.01em; }
  .lead { color: var(--muted); margin: 0 0 28px; font-size: 17px; }
  .bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
  .tabs { display: inline-flex; padding: 4px; gap: 4px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; }
  .tabs button {
    font: inherit; font-weight: 600; font-size: 15px; color: var(--muted);
    background: none; border: 0; border-radius: 8px; padding: 8px 18px; cursor: pointer;
  }
  .tabs button[aria-selected="true"] { background: var(--accent-soft); color: var(--accent); }
  .tabs button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .language { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; }
  .language svg { flex: none; }
  select {
    font: inherit; font-size: 14px; color: var(--fg); background: var(--card);
    border: 1px solid var(--border); border-radius: 10px; padding: 7px 10px; max-width: 220px;
  }
  section[hidden] { display: none; }
  h2 { font-size: 20px; margin: 28px 0 12px; }
  ol.steps { list-style: none; counter-reset: step; padding: 0; margin: 0; display: grid; gap: 12px; }
  ol.steps > li {
    counter-increment: step; position: relative;
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding-block: 16px; padding-inline: 62px 18px;
  }
  ol.steps > li::before {
    content: counter(step); position: absolute; inset-inline-start: 18px; top: 15px;
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--accent); color: #fff; font-weight: 700; font-size: 14px;
    display: grid; place-items: center;
  }
  ol.steps strong { display: block; margin-bottom: 2px; }
  ol.steps p { margin: 0; color: var(--muted); }
  .ui {
    display: inline-block; padding: 1px 8px; border-radius: 6px;
    background: var(--code-bg); border: 1px solid var(--border);
    color: var(--fg); font-weight: 600; font-size: 0.92em;
  }
  .quote { color: var(--fg); font-style: italic; }
  /* Keeps names like .dmg or ZXPManager.exe readable inside right-to-left text */
  .ui, .quote { unicode-bidi: plaintext; }
  .choice { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 8px; }
  .choice div { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px 18px; }
  .choice h3 { margin: 0 0 6px; font-size: 16px; }
  .choice p { margin: 0; color: var(--muted); font-size: 15px; }
  .note { background: var(--note-bg); border: 1px solid var(--note-border); border-radius: 14px; padding: 14px 18px; margin-top: 16px; font-size: 15px; }
  .note p { margin: 0; }
  pre {
    background: var(--code-bg); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; overflow-x: auto; font-size: 13.5px; margin: 10px 0 0;
    direction: ltr; text-align: left;
  }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  details { margin-top: 16px; background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 12px 18px; }
  summary { cursor: pointer; font-weight: 600; }
  details p { color: var(--muted); margin: 10px 0 0; }
  .requirements { margin-top: 36px; padding-top: 20px; border-top: 1px solid var(--border); color: var(--muted); font-size: 15px; }
  .requirements p { margin: 0 0 8px; }
  a { color: var(--accent); }
  footer { margin-top: 28px; color: var(--muted); font-size: 13px; }
  @media (max-width: 560px) {
    main { padding-top: 28px; }
    h1 { font-size: 25px; }
    header img { width: 56px; }
    .choice { grid-template-columns: 1fr; }
    ol.steps > li { padding-inline-start: 56px; }
    ol.steps > li::before { inset-inline-start: 14px; }
  }
</style>
</head>

(function () {
  // How each {name} is shown: as a button, as a quoted message, as bold text or as a link
  var STYLE = {
    notOpened: 'quote', protected: 'quote',
    security: 'bold', sac: 'bold', appsFolder: 'bold',
    repo: 'link'
  };
  var RTL = ['ar', 'fa', 'ur', 'ps'];

  function escapeHtml(text) {
    return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function render(text, ui, plain) {
    return text.replace(/\{(\w+)\}/g, function (all, name) {
      if (name === 'repo') {
        return '<a href="https://github.com/oddmoth/zxp-manager" dir="ltr">github.com/oddmoth/zxp-manager</a>';
      }
      var label = ui[name];
      if (label === undefined) return all;
      label = escapeHtml(label);
      if (plain) return label;
      switch (STYLE[name]) {
        case 'quote': return '<span class="quote">' + label + '</span>';
        case 'bold': return '<b>' + label + '</b>';
        default: return '<span class="ui">' + label + '</span>';
      }
    });
  }

  function apply(code) {
    var en = I18N.en, tr = I18N[code] || en;
    var ui = Object.assign({}, en.ui, tr.ui || {});
    var text = function (key) { return tr[key] !== undefined ? tr[key] : en[key]; };

    document.documentElement.lang = code;
    document.documentElement.dir = RTL.indexOf(code) >= 0 ? 'rtl' : 'ltr';
    document.title = render(text('title'), ui, true);

    document.querySelectorAll('[data-t]').forEach(function (el) {
      var plain = /^(STRONG|H1|H2|H3|SUMMARY|A)$/.test(el.tagName);
      el.innerHTML = render(text(el.getAttribute('data-t')), ui, plain);
    });
    document.querySelectorAll('[data-t-aria]').forEach(function (el) {
      el.setAttribute('aria-label', text(el.getAttribute('data-t-aria')));
    });
    select.value = code;
  }

  // Picks the first language of the visitor that this guide has
  function detect() {
    var wanted = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || 'en'];
    for (var i = 0; i < wanted.length; i++) {
      var tag = String(wanted[i]).toLowerCase();
      var base = tag.split('-')[0];
      var candidates = [];
      if (base === 'zh') {
        candidates.push(/hant|tw|hk|mo/.test(tag) ? 'zh-Hant' : 'zh-Hans');
      } else if (base === 'pt') {
        candidates.push(/-pt|-ao|-mz/.test(tag) ? 'pt-PT' : 'pt');
      } else if (base === 'no' || base === 'nn') {
        candidates.push('nb');
      } else {
        candidates.push(tag, base);
      }
      for (var j = 0; j < candidates.length; j++) {
        for (var code in I18N) {
          if (code.toLowerCase() === candidates[j].toLowerCase()) return code;
        }
      }
    }
    return 'en';
  }

  var select = document.getElementById('language');
  LANGUAGES.forEach(function (item) {
    var option = document.createElement('option');
    option.value = item[0];
    option.textContent = item[1];
    select.appendChild(option);
  });

  var saved = null;
  try { saved = localStorage.getItem('zxp-guide-language'); } catch (e) {}
  apply(saved && I18N[saved] ? saved : detect());

  select.addEventListener('change', function () {
    apply(select.value);
    try { localStorage.setItem('zxp-guide-language', select.value); } catch (e) {}
  });

  // Tabs: start on the visitor's own system (or the one in the address: #macos / #windows)
  var tabs = document.querySelectorAll('[role="tab"]');
  function show(id) {
    tabs.forEach(function (tab) {
      var selected = tab.getAttribute('aria-controls') === id;
      tab.setAttribute('aria-selected', selected ? 'true' : 'false');
      document.getElementById(tab.getAttribute('aria-controls')).hidden = !selected;
    });
  }
  tabs.forEach(function (tab) {
    tab.addEventListener('click', function () {
      var id = tab.getAttribute('aria-controls');
      show(id);
      try { history.replaceState(null, '', '#' + id); } catch (e) {}
    });
  });
  var hash = location.hash.replace('#', '');
  var platform = (navigator.userAgentData && navigator.userAgentData.platform) || navigator.platform || navigator.userAgent;
  show(hash === 'windows' || hash === 'macos' ? hash : (/win/i.test(platform) ? 'windows' : 'macos'));
})();
</script>
</body>
</html>
